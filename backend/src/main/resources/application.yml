server:
  port: 8080

spring:
  application:
    name: cashpilot-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cashpilot_db}
    username: ${DB_USER:cashpilot_user}
    password: ${DB_PASSWORD:cashpilot_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    com.cashpilot: INFO
    org.hibernate.SQL: WARN

jwt:
  secret: ${JWT_SECRET:Y2FzaHBpbG90LWFwaS1zdXBlci1zZWNyZXQta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9u}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cashpilot:
  dashboard:
    proximas-contas-dias: 7
    evolucao-saldo-dias-padrao: 30
  fluxo-caixa:
    dias-padrao: 30
